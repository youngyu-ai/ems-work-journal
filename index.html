<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>救護業務日誌 PWA 3.0</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <!-- 頂端同步監控列 (消防隊專用) -->
  <header class="app-header">
    <div class="header-main">
      <div class="brand">
        <h1>救護業務日誌</h1>
        <span class="badge-sub">EMS LOG 3.0</span>
      </div>
      <div class="sync-indicator" id="syncStatus">
        <span class="status-dot online"></span>
        <span class="status-text">連線正常</span>
        <span class="badge-pending" id="pendingCount" style="display:none;">0 待同步</span>
      </div>
    </div>
  </header>

  <!-- PWA 版本更新提示橫幅 -->
  <div id="updateBanner" class="update-banner" style="display:none;">
    <span>✨ 系統已有新版本更新！</span>
    <button id="btnApplyUpdate" class="btn-update">立即套用</button>
  </div>

  <main class="container">
    <!-- 導航選單 -->
    <nav class="nav-grid">
      <button class="nav-btn btn-memo active" data-target="section-memo">
        <span class="icon">📝</span>
        <span>新增備忘</span>
      </button>
      <button class="nav-btn btn-search" data-target="section-search">
        <span class="icon">🔍</span>
        <span>檢索日誌</span>
      </button>
      <button class="nav-btn btn-tasks" data-target="section-tasks">
        <span class="icon">☑️</span>
        <span>消防待辦</span>
      </button>
    </nav>

    <!-- 1. 新增備忘錄 (支援離線草稿儲存) -->
    <section id="section-memo" class="view-panel active">
      <form id="memoForm">
        <label>發布日期與時間</label>
        <input type="datetime-local" id="memoDate" required>

        <label>標題</label>
        <input type="text" id="memoTitle" placeholder="例如：到院前血氧量測作業標準" required>

        <label>常用快捷標籤</label>
        <div class="tag-list" id="tagList">
          <button type="button" class="tag-chip">器材</button>
          <button type="button" class="tag-chip">耗材</button>
          <button type="button" class="tag-chip">公文</button>
          <button type="button" class="tag-chip">SOP</button>
          <button type="button" class="tag-chip">案例教育</button>
        </div>

        <label>內容說明</label>
        <textarea id="memoContent" rows="4" placeholder="詳細說明勤務或交辦內容..."></textarea>

        <label>附加檔案 (按需載入上傳引擎)</label>
        <div class="file-drop-zone" id="dropZone">
          <input type="file" id="fileInput" multiple style="display:none;">
          <button type="button" class="btn-add-file" id="btnPickFile">📎 選擇相片、PDF、簡報</button>
          <div id="selectedFileList" class="selected-file-list"></div>
        </div>

        <button type="submit" class="btn-primary-action" id="btnSubmitMemo">儲存並同步至雲端</button>
      </form>
    </section>

    <!-- 2. SWR 搜尋面板 -->
    <section id="section-search" class="view-panel">
      <div class="search-filter-box">
        <input type="text" id="searchKeyword" placeholder="輸入關鍵字或標籤 (如：#公文)">
        <div class="date-range-row">
          <input type="date" id="searchStartDate">
          <input type="date" id="searchEndDate">
        </div>
        <button type="button" class="btn-search-action" id="btnExecuteSearch">開始查詢 (SWR 即時讀取)</button>
      </div>
      <div id="searchResultList" class="search-results-container"></div>
    </section>

    <!-- 3. 待辦清單面板 -->
    <section id="section-tasks" class="view-panel">
      <div id="taskListContainer" class="task-list">載入中...</div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
