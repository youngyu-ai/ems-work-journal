<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>救護業務日誌</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/components.css">
</head>

<body>
  <div class="container">
    <!-- 原版經典頂部 Header -->
    <header class="app-header">
      <div class="header-left">
        <h1 class="app-title">救護業務日誌</h1>
        <p class="app-subtitle">業務備忘錄與消防待辦管理</p>
      </div>
      <div class="header-right">
        <span id="networkBadge" class="status-badge online">🟢 連線正常</span>
      </div>
    </header>

    <!-- 原版主頁面：三大卡片導航與待辦清單 -->
    <section id="homeSection" class="app-section active">
      <div class="menu-grid">
        <div class="menu-card memo" data-target="memoSection">
          <div class="card-icon">📝</div>
          <div class="card-title">1. 新增備忘</div>
        </div>
        <div class="menu-card task" data-target="taskSection">
          <div class="card-icon">☑️</div>
          <div class="card-title">2. 新增待辦</div>
        </div>
        <div class="menu-card search" data-target="searchSection">
          <div class="card-icon">🔍</div>
          <div class="card-title">3. 搜尋日誌</div>
        </div>
      </div>

      <!-- 待辦事項 (消防) 清單面板 -->
      <div class="content-card task-panel">
        <div class="panel-header">
          <span class="panel-title">📋 待辦事項 (消防)</span>
          <div class="panel-actions">
            <span id="pendingSyncBadge" class="sync-badge" style="display: none;"></span>
            <button id="refreshTasksBtn" class="refresh-btn">🔄 重新整理</button>
          </div>
        </div>
        <div id="taskList" class="task-list">
          <div class="loading-state">⏳ 載入中...</div>
        </div>
      </div>
    </section>

    <!-- 原版 1. 新增備忘區塊 -->
    <section id="memoSection" class="app-section">
      <div class="content-card">
        <div class="panel-header">
          <button class="btn-back">⬅️ 返回首頁</button>
          <span class="panel-title" style="margin-left: 10px;">新增業務備忘</span>
        </div>
        <div class="form-group" style="margin-top: 15px;">
          <label>分類</label>
          <select id="memoCategory" class="form-control">
            <option value="救護品管">救護品管</option>
            <option value="耗材裝備">耗材裝備</option>
            <option value="訓練演習">訓練演習</option>
            <option value="分隊庶務">分隊庶務</option>
            <option value="其他業務">其他業務</option>
          </select>
        </div>
        <div class="form-group">
          <label>標題</label>
          <input type="text" id="memoTitle" class="form-control" placeholder="請輸入備忘標題">
        </div>
        <div class="form-group">
          <label>詳細內容</label>
          <textarea id="memoContent" class="form-control" rows="5" placeholder="請輸入備忘詳細內容..."></textarea>
        </div>
        <div class="form-group">
          <label>附件上傳 (可選)</label>
          <input type="file" id="memoFile" class="form-control" multiple>
        </div>
        <button id="saveMemoBtn" class="btn btn-primary" style="width: 100%; margin-top: 10px;">儲存備忘</button>
      </div>
    </section>

    <!-- 原版 2. 新增待辦區塊 -->
    <section id="taskSection" class="app-section">
      <div class="content-card">
        <div class="panel-header">
          <button class="btn-back">⬅️ 返回首頁</button>
          <span class="panel-title" style="margin-left: 10px;">新增消防待辦事項</span>
        </div>
        <div class="form-group" style="margin-top: 15px;">
          <label>待辦事項主旨</label>
          <input type="text" id="newTaskTitle" class="form-control" placeholder="例如：裝備妥善率回報">
        </div>
        <div class="form-group">
          <label>備註說明</label>
          <textarea id="newTaskNotes" class="form-control" rows="3" placeholder="補充說明或交接重點..."></textarea>
        </div>
        <div class="form-group">
          <label>預計完成日</label>
          <input type="date" id="newTaskDue" class="form-control">
        </div>
        <button id="saveTaskBtn" class="btn btn-primary" style="width: 100%; margin-top: 10px;">建立待辦</button>
      </div>
    </section>

    <!-- 原版 3. 搜尋日誌區塊 -->
    <section id="searchSection" class="app-section">
      <div class="content-card">
        <div class="panel-header">
          <button class="btn-back">⬅️ 返回首頁</button>
          <span class="panel-title" style="margin-left: 10px;">歷史日誌搜尋</span>
        </div>
        <div style="display: flex; gap: 8px; margin-top: 15px;">
          <input type="text" id="searchKeyword" class="form-control" style="flex: 1;" placeholder="輸入關鍵字 (如：耗材、OHCA...)">
          <select id="searchTargetField" class="form-control" style="width: 110px;">
            <option value="both">全部欄位</option>
            <option value="title">僅標題</option>
            <option value="content">僅內容</option>
          </select>
          <button id="searchBtn" class="btn btn-primary" style="white-space: nowrap;">搜尋</button>
        </div>
        <div id="searchResults" style="margin-top: 20px;"></div>
      </div>
    </section>
  </div>

  <script>
    // 已加入您提供的專屬 GAS 網址
    const GAS_URL = "https://script.google.com/macros/s/AKfycbx5tizEgp6f_7Rmx6jzorkDYddm-KwahOrjUNhwrDtN9Loq3ylnodUlV6cdMhneCVtw9Q/exec";

    // 頁面切換控制 (完全維持原版 active class 機制)
    function switchSection(targetId) {
      document.querySelectorAll('.app-section').forEach(sec => {
        sec.classList.remove('active');
      });
      const target = document.getElementById(targetId);
      if (target) {
        target.classList.add('active');
      }
    }

    // 綁定事件監聽器
    document.addEventListener('DOMContentLoaded', () => {
      // 三大卡片跳轉
      document.querySelectorAll('.menu-card').forEach(card => {
        card.addEventListener('click', () => {
          const target = card.getAttribute('data-target');
          if (target) switchSection(target);
        });
      });

      // 所有返回按鈕
      document.querySelectorAll('.btn-back').forEach(btn => {
        btn.addEventListener('click', () => switchSection('homeSection'));
      });

      // 重新整理
      document.getElementById('refreshTasksBtn')?.addEventListener('click', () => loadTasks(true));

      // 儲存備忘
      document.getElementById('saveMemoBtn')?.addEventListener('click', handleSaveMemo);

      // 建立待辦
      document.getElementById('saveTaskBtn')?.addEventListener('click', handleSaveTask);

      // 搜尋日誌
      document.getElementById('searchBtn')?.addEventListener('click', handleSearch);

      // 進入首頁自動載入「消防」待辦事項
      loadTasks();
    });

    // 載入待辦事項：本機快取 0 秒立現 + 背景 POST 更新
    async function loadTasks(force = false) {
      const listContainer = document.getElementById('taskList');
      const badge = document.getElementById('networkBadge');

      const cached = localStorage.getItem('original_tasks_cache');
      if (cached && !force) {
        try { renderTaskList(JSON.parse(cached)); } catch (e) {}
      }

      if (force || !cached) {
        listContainer.innerHTML = '<div class="loading-state">⏳ 正在同步「消防」待辦...</div>';
      }

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'getTasks' })
        });
        const json = await res.json();

        if (json && json.success) {
          renderTaskList(json.data);
          localStorage.setItem('original_tasks_cache', JSON.stringify(json.data));
          if (badge) {
            badge.textContent = "🟢 連線正常";
            badge.className = "status-badge online";
          }
        } else {
          if (!cached) listContainer.innerHTML = `<div class="loading-state" style="color:#c53030;">讀取失敗：${json.error || ''}</div>`;
        }
      } catch (err) {
        if (badge) {
          badge.textContent = "🟡 離線模式";
          badge.className = "status-badge offline";
        }
        if (!cached) {
          listContainer.innerHTML = `<div class="loading-state" style="color:#c53030;">連線失敗：${err.message}</div>`;
        }
      }
    }

    // 渲染待辦列表
    function renderTaskList(items) {
      const container = document.getElementById('taskList');
      if (!container) return;
      if (!items || items.length === 0) {
        container.innerHTML = '<div class="loading-state">🎉 目前無未完成的消防待辦事項</div>';
        return;
      }
      container.innerHTML = items.map(t => `
        <div class="task-item" id="task-${t.id}">
          <input type="checkbox" class="task-checkbox" onchange="completeTask('${t.id}')">
          <div class="task-content">
            <div class="task-title">${escapeHtml(t.title)}</div>
            ${t.notes ? `<div class="task-notes">${escapeHtml(t.notes)}</div>` : ''}
            ${t.due ? `<div class="task-due">📅 到期：${escapeHtml(t.due)}</div>` : ''}
          </div>
        </div>
      `).join('');
    }

    // 標記完成待辦
    window.completeTask = async function(taskId) {
      if (!confirm('確認此項待辦已完成？')) return;
      const el = document.getElementById(`task-${taskId}`);
      if (el) el.style.opacity = '0.3';

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'completeTask', taskId: taskId })
        });
        const json = await res.json();
        if (json && json.success) {
          loadTasks(true);
        } else {
          alert('標記失敗: ' + (json.error || ''));
          if (el) el.style.opacity = '1';
        }
      } catch (e) {
        alert('網路連線失敗');
        if (el) el.style.opacity = '1';
      }
    };

    // 儲存備忘
    async function handleSaveMemo() {
      const cat = document.getElementById('memoCategory').value;
      const title = document.getElementById('memoTitle').value.trim();
      const content = document.getElementById('memoContent').value.trim();
      const btn = document.getElementById('saveMemoBtn');

      if (!title) return alert('請輸入備忘標題');
      btn.disabled = true;
      btn.textContent = "儲存中...";

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'addJournal', category: cat, title: title, content: content })
        });
        const json = await res.json();
        if (json && json.success) {
          alert('備忘已順利寫入日誌！');
          document.getElementById('memoTitle').value = '';
          document.getElementById('memoContent').value = '';
          switchSection('homeSection');
        } else {
          alert('儲存失敗：' + (json.error || ''));
        }
      } catch (err) {
        alert('連線失敗：' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "儲存備忘";
      }
    }

    // 儲存待辦
    async function handleSaveTask() {
      const title = document.getElementById('newTaskTitle').value.trim();
      const notes = document.getElementById('newTaskNotes').value.trim();
      const due = document.getElementById('newTaskDue').value;
      const btn = document.getElementById('saveTaskBtn');

      if (!title) return alert('請輸入主旨');
      btn.disabled = true;
      btn.textContent = "建立中...";

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'addTask', title: title, notes: notes, due: due })
        });
        const json = await res.json();
        if (json && json.success) {
          alert('已成功建立消防待辦！');
          document.getElementById('newTaskTitle').value = '';
          document.getElementById('newTaskNotes').value = '';
          switchSection('homeSection');
          loadTasks(true);
        } else {
          alert('建立失敗：' + (json.error || ''));
        }
      } catch (err) {
        alert('連線失敗：' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "建立待辦";
      }
    }

    // 搜尋日誌
    async function handleSearch() {
      const kw = document.getElementById('searchKeyword').value.trim();
      const field = document.getElementById('searchTargetField').value;
      const box = document.getElementById('searchResults');

      if (!kw) return alert('請輸入關鍵字');
      box.innerHTML = '<div class="loading-state">🔍 搜尋中...</div>';

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'search', keyword: kw, targetField: field })
        });
        const json = await res.json();
        if (json && json.success && json.data.length > 0) {
          box.innerHTML = json.data.map(r => `
            <div style="border-bottom: 1px solid #e5e5e0; padding: 12px 0;">
              <div style="font-size: 12px; color: #888;">${escapeHtml(r.time || '')}</div>
              <div style="font-weight: bold; font-size: 15px; margin: 4px 0;">${escapeHtml(r.title || '')}</div>
              <div style="font-size: 13px; color: #444;">${(r.lines || []).map(l => `<div>${escapeHtml(l)}</div>`).join('')}</div>
            </div>
          `).join('');
        } else {
          box.innerHTML = '<div class="loading-state">查無符合日誌紀錄</div>';
        }
      } catch (e) {
        box.innerHTML = '<div class="loading-state" style="color:#c53030;">搜尋連線逾時</div>';
      }
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
