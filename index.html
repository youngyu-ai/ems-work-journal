<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>救護業務日誌</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
  <style>
    :root {
      --bg: #f5f4ef;
      --card: #ffffff;
      --border: #e2e0d8;
      --text: #2c2c2b;
      --text-sub: #76746e;
      --accent: #8b3a2b;
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .container { width: 100%; max-width: 650px; }
    .header {
      background: var(--card);
      padding: 16px 20px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      border-left: 5px solid var(--accent);
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 { margin: 0; font-size: 20px; font-weight: 600; }
    .header p { margin: 4px 0 0 0; font-size: 13px; color: var(--text-sub); }
    .badge {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      background: #e8f5e9;
      color: #2e7d32;
      font-weight: 500;
    }
    .badge.offline { background: #fff3e0; color: #e65100; }

    /* 三大功能卡片 */
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
    .btn-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 8px;
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: transform 0.1s, background 0.1s;
    }
    .btn-card:active { transform: scale(0.97); background: #eee; }
    .btn-icon { font-size: 28px; margin-bottom: 6px; }
    .btn-title { font-size: 14px; font-weight: 600; }

    /* 區塊卡片 */
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 16px;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 15px;
    }
    .panel-title { font-size: 16px; font-weight: 600; }
    .btn-text { background: none; border: none; color: #1976d2; cursor: pointer; font-size: 14px; }
    .btn-back {
      background: #eee;
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }

    /* 待辦列表 */
    .task-list { display: flex; flex-direction: column; gap: 8px; }
    .task-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px;
      background: #faf9f6;
      border: 1px solid #eeece5;
      border-radius: 6px;
    }
    .task-row input[type="checkbox"] { width: 18px; height: 18px; margin-top: 3px; cursor: pointer; }
    .task-body { flex: 1; }
    .task-title { font-size: 15px; font-weight: 600; line-height: 1.4; }
    .task-notes { font-size: 13px; color: #666; margin-top: 4px; white-space: pre-wrap; }
    .task-due { font-size: 12px; color: #d97706; margin-top: 4px; }

    /* 表單項目 */
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .input-ctrl {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 14px;
    }
    .btn-submit {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 4px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-submit:active { opacity: 0.9; }
  </style>
</head>

<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div>
        <h1>救護業務日誌</h1>
        <p>業務備忘錄與消防待辦管理</p>
      </div>
      <div id="statusBadge" class="badge">🟢 連線正常</div>
    </div>

    <!-- 首頁面 -->
    <div id="pageHome">
      <div class="grid">
        <div class="btn-card" onclick="navTo('pageMemo')">
          <div class="btn-icon">📝</div>
          <div class="btn-title">1. 新增備忘</div>
        </div>
        <div class="btn-card" onclick="navTo('pageTask')">
          <div class="btn-icon">☑️</div>
          <div class="btn-title">2. 新增待辦</div>
        </div>
        <div class="btn-card" onclick="navTo('pageSearch')">
          <div class="btn-icon">🔍</div>
          <div class="btn-title">3. 搜尋日誌</div>
        </div>
      </div>

      <!-- 待辦清單面板 -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">📋 待辦事項 (消防)</span>
          <button class="btn-text" onclick="loadTasks(true)">🔄 重新整理</button>
        </div>
        <div id="taskBox" class="task-list">
          <div style="text-align:center; color:#888; padding:15px;">⏳ 載入「消防」待辦中...</div>
        </div>
      </div>
    </div>

    <!-- 1. 新增備忘頁面 -->
    <div id="pageMemo" style="display:none;">
      <div class="panel">
        <div class="panel-header">
          <button class="btn-back" onclick="navTo('pageHome')">⬅️ 返回首頁</button>
          <span class="panel-title">新增業務備忘</span>
        </div>
        <div class="form-group">
          <label>分類</label>
          <select id="memoCat" class="input-ctrl">
            <option value="救護品管">救護品管</option>
            <option value="耗材裝備">耗材裝備</option>
            <option value="訓練演習">訓練演習</option>
            <option value="分隊庶務">分隊庶務</option>
            <option value="其他業務">其他業務</option>
          </select>
        </div>
        <div class="form-group">
          <label>標題</label>
          <input type="text" id="memoTitle" class="input-ctrl" placeholder="請輸入備忘標題">
        </div>
        <div class="form-group">
          <label>內容</label>
          <textarea id="memoContent" class="input-ctrl" rows="5" placeholder="請輸入詳細內容..."></textarea>
        </div>
        <button class="btn-submit" id="btnSaveMemo" onclick="handleSaveMemo()">儲存備忘</button>
      </div>
    </div>

    <!-- 2. 新增待辦頁面 -->
    <div id="pageTask" style="display:none;">
      <div class="panel">
        <div class="panel-header">
          <button class="btn-back" onclick="navTo('pageHome')">⬅️ 返回首頁</button>
          <span class="panel-title">新增消防待辦事項</span>
        </div>
        <div class="form-group">
          <label>待辦事項主旨</label>
          <input type="text" id="taskTitle" class="input-ctrl" placeholder="例如：裝備妥善率回報">
        </div>
        <div class="form-group">
          <label>備註說明</label>
          <textarea id="taskNotes" class="input-ctrl" rows="3" placeholder="補充說明或交接重點..."></textarea>
        </div>
        <div class="form-group">
          <label>到期日</label>
          <input type="date" id="taskDue" class="input-ctrl">
        </div>
        <button class="btn-submit" id="btnSaveTask" onclick="handleSaveTask()">建立待辦</button>
      </div>
    </div>

    <!-- 3. 搜尋日誌頁面 -->
    <div id="pageSearch" style="display:none;">
      <div class="panel">
        <div class="panel-header">
          <button class="btn-back" onclick="navTo('pageHome')">⬅️ 返回首頁</button>
          <span class="panel-title">歷史日誌搜尋</span>
        </div>
        <div style="display:flex; gap:8px; margin-bottom:15px;">
          <input type="text" id="searchKw" class="input-ctrl" placeholder="輸入關鍵字 (如：耗材、OHCA)..." style="flex:1;">
          <select id="searchField" class="input-ctrl" style="width:110px;">
            <option value="both">全部欄位</option>
            <option value="title">僅標題</option>
            <option value="content">僅內容</option>
          </select>
          <button class="btn-submit" style="width:auto; padding:0 16px;" onclick="handleSearch()">搜尋</button>
        </div>
        <div id="searchResultBox"></div>
      </div>
    </div>
  </div>

  <script>
    // 綁定您提供的正式 GAS 網址
    const GAS_URL = "https://script.google.com/macros/s/AKfycbx5tizEgp6f_7Rmx6jzorkDYddm-KwahOrjUNhwrDtN9Loq3ylnodUlV6cdMhneCVtw9Q/exec";

    // 頁面切換
    function navTo(pageId) {
      ['pageHome', 'pageMemo', 'pageTask', 'pageSearch'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = (id === pageId) ? 'block' : 'none';
      });
    }

    // SWR 極速載入待辦清單：本地快取 0 秒立現 + 背景同步
    async function loadTasks(force = false) {
      const box = document.getElementById('taskBox');
      const badge = document.getElementById('statusBadge');
      
      // 1. 本地快取秒開
      const cached = localStorage.getItem('fire_tasks_cache');
      if (cached) {
        try {
          const cachedItems = JSON.parse(cached);
          if (cachedItems && cachedItems.length > 0) {
            renderTaskList(cachedItems);
          }
        } catch(e) {}
      } else if (force) {
        box.innerHTML = '<div style="text-align:center; color:#888; padding:15px;">⏳ 正在連線讀取「消防」待辦...</div>';
      }

      // 2. 向 GAS 抓取最新資料
      try {
        const res = await fetch(`${GAS_URL}?action=getTasks&_t=${Date.now()}`, { 
          method: 'GET', 
          redirect: 'follow' 
        });
        const json = await res.json();
        if (json && json.success) {
          renderTaskList(json.data);
          localStorage.setItem('fire_tasks_cache', JSON.stringify(json.data));
          badge.textContent = "🟢 連線正常";
          badge.className = "badge";
        } else {
          if (!cached) box.innerHTML = `<div style="color:#c53030; text-align:center; padding:10px;">讀取失敗：${json.error || '後端錯誤'}</div>`;
        }
      } catch (err) {
        badge.textContent = "🟡 離線模式";
        badge.className = "badge offline";
        if (!cached) box.innerHTML = '<div style="color:#c53030; text-align:center; padding:10px;">連線異常，請重新整理重試</div>';
      }
    }

    // 渲染待辦列表
    function renderTaskList(items) {
      const box = document.getElementById('taskBox');
      if (!items || items.length === 0) {
        box.innerHTML = '<div style="text-align:center; color:#888; padding:12px;">🎉 目前無未完成的消防待辦事項</div>';
        return;
      }
      box.innerHTML = items.map(t => `
        <div class="task-row" id="task-${t.id}">
          <input type="checkbox" onchange="completeTask('${t.id}')">
          <div class="task-body">
            <div class="task-title">${escapeHtml(t.title)}</div>
            ${t.notes ? `<div class="task-notes">${escapeHtml(t.notes)}</div>` : ''}
            ${t.due ? `<div class="task-due">📅 到期：${escapeHtml(t.due)}</div>` : ''}
          </div>
        </div>
      `).join('');
    }

    // 完成待辦
    async function completeTask(taskId) {
      if (!confirm('確認此項待辦已完成？')) return;
      const el = document.getElementById(`task-${taskId}`);
      if (el) el.style.opacity = '0.3';
      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          redirect: 'follow',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'completeTask', taskId: taskId })
        });
        const json = await res.json();
        if (json && json.success) {
          loadTasks(true);
        } else {
          alert('標記失敗: ' + (json.error || ''));
          if (el) el.style.opacity = '1';
        }
      } catch (e) {
        alert('網路連線逾時');
        if (el) el.style.opacity = '1';
      }
    }

    // 儲存備忘
    async function handleSaveMemo() {
      const cat = document.getElementById('memoCat').value;
      const title = document.getElementById('memoTitle').value.trim();
      const content = document.getElementById('memoContent').value.trim();
      const btn = document.getElementById('btnSaveMemo');

      if (!title) return alert('請輸入標題');
      btn.disabled = true;
      btn.textContent = "儲存中...";

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          redirect: 'follow',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'addJournal', category: cat, title: title, content: content })
        });
        const json = await res.json();
        if (json && json.success) {
          alert('備忘已順利寫入日誌！');
          document.getElementById('memoTitle').value = '';
          document.getElementById('memoContent').value = '';
          navTo('pageHome');
        } else {
          alert('儲存失敗：' + (json.error || ''));
        }
      } catch (err) {
        alert('連線失敗：' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "儲存備忘";
      }
    }

    // 儲存待辦
    async function handleSaveTask() {
      const title = document.getElementById('taskTitle').value.trim();
      const notes = document.getElementById('taskNotes').value.trim();
      const due = document.getElementById('taskDue').value;
      const btn = document.getElementById('btnSaveTask');

      if (!title) return alert('請輸入主旨');
      btn.disabled = true;
      btn.textContent = "建立中...";

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          redirect: 'follow',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'addTask', title: title, notes: notes, due: due })
        });
        const json = await res.json();
        if (json && json.success) {
          alert('已成功建立消防待辦！');
          document.getElementById('taskTitle').value = '';
          document.getElementById('taskNotes').value = '';
          navTo('pageHome');
          loadTasks(true);
        } else {
          alert('建立失敗：' + (json.error || ''));
        }
      } catch (err) {
        alert('連線失敗：' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "建立待辦";
      }
    }

    // 搜尋日誌
    async function handleSearch() {
      const kw = document.getElementById('searchKw').value.trim();
      const field = document.getElementById('searchField').value;
      const box = document.getElementById('searchResultBox');

      if (!kw) return alert('請輸入關鍵字');
      box.innerHTML = '<div style="text-align:center; color:#888; padding:15px;">🔍 搜尋中...</div>';

      try {
        const res = await fetch(`${GAS_URL}?action=search&keyword=${encodeURIComponent(kw)}&targetField=${encodeURIComponent(field)}`, {
          method: 'GET',
          redirect: 'follow'
        });
        const json = await res.json();
        if (json && json.success && json.data.length > 0) {
          box.innerHTML = json.data.map(r => `
            <div style="border-bottom:1px solid #ddd; padding:10px 0;">
              <div style="font-size:12px; color:#888;">${escapeHtml(r.time || '')}</div>
              <div style="font-weight:600; font-size:15px; margin:4px 0;">${escapeHtml(r.title || '')}</div>
              <div style="font-size:13px; color:#444;">${(r.lines || []).map(l => `<div>${escapeHtml(l)}</div>`).join('')}</div>
            </div>
          `).join('');
        } else {
          box.innerHTML = '<div style="text-align:center; color:#888; padding:15px;">查無符合日誌紀錄</div>';
        }
      } catch (e) {
        box.innerHTML = '<div style="color:#c53030; text-align:center; padding:15px;">搜尋連線逾時</div>';
      }
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // 網頁載入時自動讀取待辦
    window.addEventListener('DOMContentLoaded', () => loadTasks());
  </script>
</body>
</html>
