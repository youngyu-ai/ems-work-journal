<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>救護業務日誌</title>
  <link rel="manifest" href="manifest.json">
  <!-- 內嵌 Favicon：徹底解決 favicon.ico 404 問題 -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/components.css">
</head>

<body>
  <div class="container">
    <!-- 原版經典 Header -->
    <header class="app-header">
      <div class="header-left">
        <h1 class="app-title">救護業務日誌</h1>
        <p class="app-subtitle">業務備忘錄與消防待辦管理</p>
      </div>
      <div class="header-right">
        <span id="networkBadge" class="status-badge online">🟢 連線正常</span>
      </div>
    </header>

    <!-- 主頁面：三大功能按鈕卡片 -->
    <section id="homeSection" class="app-section active">
      <div class="menu-grid">
        <div class="menu-card memo" data-target="memoSection">
          <div class="card-icon">📝</div>
          <div class="card-title">1. 新增備忘</div>
        </div>
        <div class="menu-card task" data-target="taskSection">
          <div class="card-icon">☑️</div>
          <div class="card-title">2. 新增待辦</div>
        </div>
        <div class="menu-card search" data-target="searchSection">
          <div class="card-icon">🔍</div>
          <div class="card-title">3. 搜尋日誌</div>
        </div>
      </div>

      <!-- 待辦事項 (消防) 清單面板 -->
      <div class="content-card task-panel">
        <div class="panel-header">
          <span class="panel-title">📋 待辦事項 (消防)</span>
          <div class="panel-actions">
            <span id="pendingSyncBadge" class="sync-badge" style="display: none;"></span>
            <button id="refreshTasksBtn" class="refresh-btn">🔄 重新整理</button>
          </div>
        </div>
        <div id="taskList" class="task-list">
          <div class="loading-state">⏳ 載入中...</div>
        </div>
      </div>
    </section>

    <!-- 1. 新增備忘區塊 -->
    <section id="memoSection" class="app-section">
      <div class="content-card">
        <div class="panel-header">
          <button class="btn-back">⬅️ 返回首頁</button>
          <span class="panel-title" style="margin-left: 10px;">新增業務備忘</span>
        </div>
        <div class="form-group" style="margin-top: 15px;">
          <label>分類</label>
          <select id="memoCategory" class="form-control">
            <option value="救護品管">救護品管</option>
            <option value="耗材裝備">耗材裝備</option>
            <option value="訓練演習">訓練演習</option>
            <option value="分隊庶務">分隊庶務</option>
            <option value="其他業務">其他業務</option>
          </select>
        </div>
        <div class="form-group">
          <label>標題</label>
          <input type="text" id="memoTitle" class="form-control" placeholder="請輸入備忘標題">
        </div>
        <div class="form-group">
          <label>詳細內容</label>
          <textarea id="memoContent" class="form-control" rows="5" placeholder="請輸入備忘詳細內容..."></textarea>
        </div>
        <div class="form-group">
          <label>附件上傳 (可選)</label>
          <input type="file" id="memoFile" class="form-control" multiple>
        </div>
        <button id="saveMemoBtn" class="btn btn-primary" style="width: 100%; margin-top: 10px;">儲存備忘</button>
      </div>
    </section>

    <!-- 2. 新增待辦區塊 -->
    <section id="taskSection" class="app-section">
      <div class="content-card">
        <div class="panel-header">
          <button class="btn-back">⬅️ 返回首頁</button>
          <span class="panel-title" style="margin-left: 10px;">新增消防待辦事項</span>
        </div>
        <div class="form-group" style="margin-top: 15px;">
          <label>待辦事項主旨</label>
          <input type="text" id="newTaskTitle" class="form-control" placeholder="例如：裝備妥善率回報">
        </div>
        <div class="form-group">
          <label>備註說明</label>
          <textarea id="newTaskNotes" class="form-control" rows="3" placeholder="補充說明或交接重點..."></textarea>
        </div>
        <div class="form-group">
          <label>預計完成日</label>
          <input type="date" id="newTaskDue" class="form-control">
        </div>
        <button id="saveTaskBtn" class="btn btn-primary" style="width: 100%; margin-top: 10px;">建立待辦</button>
      </div>
    </section>

    <!-- 3. 搜尋日誌區塊 -->
    <section id="searchSection" class="app-section">
      <div class="content-card">
        <div class="panel-header">
          <button class="btn-back">⬅️ 返回首頁</button>
          <span class="panel-title" style="margin-left: 10px;">歷史日誌搜尋</span>
        </div>
        <div style="display: flex; gap: 8px; margin-top: 15px;">
          <input type="text" id="searchKeyword" class="form-control" style="flex: 1;" placeholder="輸入關鍵字 (如：耗材、OHCA...)">
          <select id="searchTargetField" class="form-control" style="width: 110px;">
            <option value="both">全部欄位</option>
            <option value="title">僅標題</option>
            <option value="content">僅內容</option>
          </select>
          <button id="searchBtn" class="btn btn-primary" style="white-space: nowrap;">搜尋</button>
        </div>
        <div id="searchResults" style="margin-top: 20px;"></div>
      </div>
    </section>
  </div>

  <!-- 主邏輯 ES Module 載入 -->
  <script type="module" src="js/app.js"></script>

  <!-- Service Worker 離線快取註冊 -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW 註冊成功:', reg.scope))
          .catch(err => console.error('SW 註冊失敗:', err));
      });
    }
  </script>
</body>
</html>
